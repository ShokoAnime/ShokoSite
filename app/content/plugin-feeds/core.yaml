# The core plugin feed, served at /core-plugin-manifest.json.
#
# Each entry is the URL of a plugin's own manifest. The site fetches them
# and serves them as one list with every package inlined, so a plugin
# release shows up within a few minutes without touching this file. Add a
# plugin here once, when it first releases.
plugins:
  - https://raw.githubusercontent.com/ShokoAnime/Shoko.Plugin.Anilist/metadata/manifest.json
  - https://raw.githubusercontent.com/ShokoAnime/Shoko.Plugin.OfflineImporter/metadata/manifest.json
  - https://raw.githubusercontent.com/ShokoAnime/Shoko.Plugin.Tmdb/metadata/manifest.json
  - https://raw.githubusercontent.com/ShokoAnime/Shoko.Plugin.WebAOM/metadata/manifest.json
